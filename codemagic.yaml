# Cloud macOS build for the iOS test IPA.
# Produces an UNSIGNED .ipa; signing happens on the device side (AltStore/SideStore
# re-sign every install), so no Apple credentials exist in CI.
workflows:
  ios-unsigned:
    name: HardlyReader iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22.23.1
      xcode: latest
      vars:
        CARGO_TERM_COLOR: always
    cache:
      cache_paths:
        - ~/.cargo
        - $HOME/.rustup
        - $HOME/Library/Caches/tauri
        - $CM_BUILD_DIR/src-tauri/target
    scripts:
      - name: Toolchain
        script: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          rustc -V; cargo -V; xcodebuild -version
      - name: Install frontend deps
        script: |
          set -euo pipefail
          node -v
          # Corepack walks up to /Users/builder/package.json and finds a yarn
          # packageManager field there, so it refuses to run pnpm. Install pnpm
          # ourselves and keep corepack out of it.
          export COREPACK_ENABLE_PROJECT_SPEC=0 COREPACK_ENABLE_STRICT=0
          npm i -g pnpm@12 --force >/dev/null
          pnpm -v
          pnpm install --frozen-lockfile
      - name: Prepare Homebrew
        script: |
          set -euo pipefail
          # `pod install` makes tauri reinstall libimobiledevice, and brew then
          # refuses to pour its ca-certificates dependency because a keg is
          # already linked. Unlink it so the pour is allowed to relink.
          brew unlink ca-certificates >/dev/null 2>&1 || true
          brew --version | head -1
      - name: Generate the Xcode project
        script: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          # tauri's iOS bootstrap insists on `brew reinstall libimobiledevice`,
          # and this image's Homebrew dies inside that formula's post-install
          # ("unknown install step: run"). The package is already installed and
          # only device deploy needs it, so answer that one call with success.
          mkdir -p "$CM_BUILD_DIR/bin"
          printf '%s\n' '#!/bin/bash' \
            'if { [ "$1" = reinstall ] || [ "$1" = install ]; } && [ "$2" = libimobiledevice ]; then' \
            '  echo "brew wrapper: libimobiledevice is already installed"; exit 0' \
            'fi' \
            'exec /opt/homebrew/bin/brew "$@"' > "$CM_BUILD_DIR/bin/brew"
          chmod +x "$CM_BUILD_DIR/bin/brew"
          export PATH="$CM_BUILD_DIR/bin:$PATH"
          pnpm tauri ios init --ci
          ls -la src-tauri/gen/apple
      - name: Add the native Swift sources
        script: |-
          set -euo pipefail
          # Two files here are half Swift, the half that cannot be written in
          # Rust: `src-tauri/ios/ShareSheet.swift` (the system share sheet) and
          # `src-tauri/ios/SafeArea.swift` (the webview is not inset by UIKit —
          # see that file for why the strips above the header and under the last
          # row are the window's background and not the page's). They are
          # committed outside the Xcode project because that project is a build
          # product — `tauri ios init` above regenerates it from the template on
          # every run.
          #
          # So: find the directory the template compiles Swift from, copy the
          # files in, and re-run XcodeGen so they are in the app target rather
          # than merely on disk. A Swift file that is in no target's compile
          # sources compiles nowhere and fails silently, which is why every
          # expected filename is grepped out of the generated pbxproj at the end
          # of this step — and why the packaged binary is grepped again after the
          # build.
          cat src-tauri/gen/apple/project.yml
          ls -la src-tauri/ios
          EXISTING=$(find src-tauri/gen/apple -name '*.swift' -not -path '*/build/*' -print -quit)
          if [ -n "$EXISTING" ]; then
            SOURCES=$(dirname "$EXISTING")
          else
            SOURCES=src-tauri/gen/apple/Sources
          fi
          [ -d "$SOURCES" ] || { echo "no Swift source directory in gen/apple"; exit 1; }
          echo "swift sources: $SOURCES"
          cp -v src-tauri/ios/*.swift "$SOURCES/"
          cd src-tauri/gen/apple
          set -- *.xcodeproj
          PROJ="$1"
          [ -d "$PROJ" ] || { echo "no .xcodeproj was generated"; exit 1; }
          echo "project: $PROJ"
          XCODEGEN=$(command -v xcodegen || echo /opt/homebrew/bin/xcodegen)
          "$XCODEGEN" generate --spec project.yml
          for swift in ShareSheet.swift SafeArea.swift; do
            if grep -q "$swift in Sources" "$PROJ/project.pbxproj"; then
              echo "in the app target: $swift"
            else
              echo "$swift is not in the app target's compile sources"
              grep -n "${swift%.swift}" "$PROJ/project.pbxproj" || true
              exit 1
            fi
          done
          echo "the share bridge and the safe-area fix are in the app target"
      - name: Build unsigned .app
        script: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          export PATH="$CM_BUILD_DIR/bin:$PATH"
          # Xcode's Build Rust Code phase shells out to `tauri ios xcode-script`,
          # which only works while `tauri ios build` is the thing driving it —
          # a bare xcodebuild fails. Let the CLI orchestrate Xcode.
          pnpm tauri ios build --help || true
          pnpm tauri ios build --ci --no-sign
          echo "--- build products:"
          find src-tauri/gen/apple/build src-tauri/target -maxdepth 6 -name '*.app' 2>/dev/null || true
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          # -print -quit, not `| head -1`: under pipefail head closes the pipe and
          # find dies of SIGPIPE, which reads as a failed step.
          APP=$(find src-tauri/gen/apple/build "$CM_BUILD_DIR/build" -maxdepth 6 -name '*.app' -print -quit 2>/dev/null || true)
          [ -n "$APP" ] || { echo "no .app was produced"; exit 1; }
          APP="$(cd "$(dirname "$APP")" && pwd)/$(basename "$APP")"
          echo "app=$APP"
          rm -rf "$CM_BUILD_DIR/build/ipa"; mkdir -p "$CM_BUILD_DIR/build/ipa/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/build/ipa/Payload/"
          cd "$CM_BUILD_DIR/build/ipa"
          zip -qry "$CM_BUILD_DIR/build/HardlyReader-unsigned.ipa" Payload
          unzip -l "$CM_BUILD_DIR/build/HardlyReader-unsigned.ipa" | head -20
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          # The card this workflow serves is not done until the IPA *contains* the
          # Swift, and a static lib plus a Swift file that never got linked looks
          # exactly like a successful build. Ask the binary itself: each Swift
          # file's marker (both are logged when the code runs) and the names the
          # Rust side links against all have to be in there.
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          echo "binary: $BIN"
          # Raw bytes, not `strings | grep -q`: grep exits on its first match,
          # closes the pipe and pipefail turns a match into a SIGPIPE failure,
          # and macOS and GNU `strings` do not agree on what they print anyway.
          #
          # The Swift markers are the real proof that a file was linked, and the
          # C symbol name is not: the release binary is stripped of its local
          # symbols, so `hardlyreader_safe_area` is not in it even though the
          # code is (measured — the build this check was written against failed
          # on exactly that needle with every marker present). `share_sheet` is
          # the Rust command name, which is a string literal and does survive.
          for symbol in hardlyreader-share-sheet-1 hardlyreader-safe-area-1 share_sheet; do
            if grep -aq -e "$symbol" "$BIN"; then
              echo "found in the binary: $symbol"
            else
              echo "MISSING from the binary: $symbol — a Swift half was not linked"
              exit 1
            fi
          done
    artifacts:
      - build/HardlyReader-unsigned.ipa
