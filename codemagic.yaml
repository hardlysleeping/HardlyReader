# Cloud macOS build for the iOS test IPA.
# Produces an UNSIGNED .ipa; signing happens on the device side (AltStore/SideStore
# re-sign every install), so no Apple credentials exist in CI.
workflows:
  ios-unsigned:
    name: HardlyReader iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22.23.1
      xcode: latest
      vars:
        CARGO_TERM_COLOR: always
    cache:
      cache_paths:
        - ~/.cargo
        - $HOME/.rustup
        - $HOME/Library/Caches/tauri
        - $CM_BUILD_DIR/src-tauri/target
    scripts:
      - name: Toolchain
        script: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          rustc -V; cargo -V; xcodebuild -version
      - name: Install frontend deps
        script: |
          set -euo pipefail
          node -v
          # Corepack walks up to /Users/builder/package.json and finds a yarn
          # packageManager field there, so it refuses to run pnpm. Install pnpm
          # ourselves and keep corepack out of it.
          export COREPACK_ENABLE_PROJECT_SPEC=0 COREPACK_ENABLE_STRICT=0
          npm i -g pnpm@12 --force >/dev/null
          pnpm -v
          pnpm install --frozen-lockfile
      - name: Prepare Homebrew
        script: |
          set -euo pipefail
          # `pod install` makes tauri reinstall libimobiledevice, and brew then
          # refuses to pour its ca-certificates dependency because a keg is
          # already linked. Unlink it so the pour is allowed to relink.
          brew unlink ca-certificates >/dev/null 2>&1 || true
          brew --version | head -1
      - name: Generate the Xcode project
        script: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          # tauri's iOS bootstrap insists on `brew reinstall libimobiledevice`,
          # and this image's Homebrew dies inside that formula's post-install
          # ("unknown install step: run"). The package is already installed and
          # only device deploy needs it, so answer that one call with success.
          mkdir -p "$CM_BUILD_DIR/bin"
          printf '%s\n' '#!/bin/bash' \
            'if { [ "$1" = reinstall ] || [ "$1" = install ]; } && [ "$2" = libimobiledevice ]; then' \
            '  echo "brew wrapper: libimobiledevice is already installed"; exit 0' \
            'fi' \
            'exec /opt/homebrew/bin/brew "$@"' > "$CM_BUILD_DIR/bin/brew"
          chmod +x "$CM_BUILD_DIR/bin/brew"
          export PATH="$CM_BUILD_DIR/bin:$PATH"
          pnpm tauri ios init --ci
          ls -la src-tauri/gen/apple
      - name: Wire the background refresh into the Xcode project
        script: |-
          set -euo pipefail
          # The Swift and Objective-C halves live in src-tauri/ios, because this
          # Linux host cannot run `tauri ios init`. They are copied into the
          # generated project and it is regenerated before Xcode sees it; the
          # Info.plist keys come from src-tauri/Info.ios.plist, which Tauri
          # merges itself during `tauri ios build`.
          #
          # XcodeGen is not part of the stock image, and the script refuses to
          # run without it (a copied file that no target compiles is a feature
          # that silently never runs), so install it here.
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
          bash scripts/ios-background-refresh.sh
      - name: Build unsigned .app
        script: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          export PATH="$CM_BUILD_DIR/bin:$PATH"
          # Xcode's Build Rust Code phase shells out to `tauri ios xcode-script`,
          # which only works while `tauri ios build` is the thing driving it —
          # a bare xcodebuild fails. Let the CLI orchestrate Xcode.
          pnpm tauri ios build --help || true
          pnpm tauri ios build --ci --no-sign
          echo "--- build products:"
          find src-tauri/gen/apple/build src-tauri/target -maxdepth 6 -name '*.app' 2>/dev/null || true
      - name: Check the app declares its background task
        script: |-
          set -euo pipefail
          # A build that compiles is not a build that refreshes: a launch handler
          # registered under an identifier the plist does not permit is never
          # called, and nothing anywhere reports it. So the keys are read back out
          # of the built app, and the C entry point is looked for in the binary —
          # both of which are only true if the wiring step actually landed.
          #
          # Each assertion prints what it found before failing, so a red build
          # says which half is missing instead of only that one of them is.
          echo "--- what the build produced:"
          find src-tauri/gen/apple/build "$CM_BUILD_DIR/build" -maxdepth 6 \
            \( -name '*.app' -o -name '*.xcarchive' -o -name '*.ipa' \) 2>/dev/null || true
          APP=$(find src-tauri/gen/apple/build "$CM_BUILD_DIR/build" -maxdepth 6 -name '*.app' -print -quit 2>/dev/null || true)
          [ -n "$APP" ] || { echo "::error::no .app was produced"; exit 1; }
          echo "app=$APP"
          PLIST="$APP/Info.plist"
          echo "--- the keys the background refresh needs:"
          /usr/libexec/PlistBuddy -c 'Print :BGTaskSchedulerPermittedIdentifiers' "$PLIST" \
            || echo "(missing BGTaskSchedulerPermittedIdentifiers)"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$PLIST" \
            || echo "(missing UIBackgroundModes)"
          status=0
          /usr/libexec/PlistBuddy -c 'Print :BGTaskSchedulerPermittedIdentifiers:0' "$PLIST" 2>/dev/null \
            | grep -qx 'ing.hardlysleep.hardlyreader.refresh' \
            || { echo "::error::BGTaskSchedulerPermittedIdentifiers does not start with the refresh identifier"; status=1; }
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$PLIST" 2>/dev/null \
            | grep -qx 'fetch' \
            || { echo "::error::UIBackgroundModes does not start with fetch"; status=1; }
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")
          echo "--- refresh entry points in $EXEC:"
          nm -gU "$APP/$EXEC" | grep 'hardlyreader_app_refresh' \
            || { echo "::error::the refresh entry points are not in the binary"; status=1; }
          [ "$status" -eq 0 ] || exit 1
          echo "background refresh: declared in Info.plist, wired to the binary"
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          # -print -quit, not `| head -1`: under pipefail head closes the pipe and
          # find dies of SIGPIPE, which reads as a failed step.
          APP=$(find src-tauri/gen/apple/build "$CM_BUILD_DIR/build" -maxdepth 6 -name '*.app' -print -quit 2>/dev/null || true)
          [ -n "$APP" ] || { echo "no .app was produced"; exit 1; }
          APP="$(cd "$(dirname "$APP")" && pwd)/$(basename "$APP")"
          echo "app=$APP"
          rm -rf "$CM_BUILD_DIR/build/ipa"; mkdir -p "$CM_BUILD_DIR/build/ipa/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/build/ipa/Payload/"
          cd "$CM_BUILD_DIR/build/ipa"
          zip -qry "$CM_BUILD_DIR/build/HardlyReader-unsigned.ipa" Payload
          unzip -l "$CM_BUILD_DIR/build/HardlyReader-unsigned.ipa" | head -20
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
    artifacts:
      - build/HardlyReader-unsigned.ipa
