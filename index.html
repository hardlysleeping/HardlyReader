<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is what makes the safe-area insets real: without it
         `env(safe-area-inset-*)` is 0 everywhere and the app draws under the
         status bar on Android, where the window is edge-to-edge. -->
    <!-- No zoom. The app is a layout, not a document to be inspected: a pinch
         scaled the header, the panes and the type independently of the reading
         size the app already offers, and left the grid measured at the zoomed
         width (`visualViewport` resizes on every zoom step, which on Android
         arrives as a storm of resize events). `user-scalable=no` and
         `maximum-scale=1` are what the WebView honours; the `touch-action` rule
         in `app.css` stops the double-tap fallback. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>HardlyReader</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0078e0" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
