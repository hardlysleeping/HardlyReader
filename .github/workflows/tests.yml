name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshrss-integration:
    name: FreshRSS Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Docker
        run: |
          docker version
          docker compose version

      - name: Run FreshRSS integration tests
        env:
          KEEP_CONTAINERS_ON_FAILURE: "1"
        run: |
          chmod +x tests/integration/run.sh
          tests/integration/run.sh

      - name: Collect FreshRSS diagnostics
        if: failure()
        run: |
          mkdir -p tests/integration/artifacts
          COMPOSE="docker compose -f tests/integration/compose.yml"

          $COMPOSE ps -a > tests/integration/artifacts/compose-ps.txt 2>&1 || true
          $COMPOSE logs --no-color --timestamps freshrss \
            > tests/integration/artifacts/freshrss.log 2>&1 || true

          # Select by compose service label so a different project name in run.sh
          # or a renamed container does not silently empty this artifact.
          docker ps -aq --filter "label=com.docker.compose.service=freshrss" \
            | xargs -r docker inspect \
            > tests/integration/artifacts/freshrss-inspect.json 2>&1 || true

      - name: Upload FreshRSS logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: freshrss-integration-logs-${{ github.run_id }}
          path: tests/integration/artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          docker compose -f tests/integration/compose.yml down \
            --volumes --remove-orphans || true

  frontend:
    name: Frontend / Svelte
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check Svelte and TypeScript
        run: pnpm check

      - name: Build
        run: pnpm build

      # Runs each suite in its own process: a suite that throws must fail the
      # job, not be hidden behind the last line of a pipe.
      - name: Unit suites
        run: pnpm test

  phpunit:
    name: PHPUnit / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.2"
          - "8.3"
          - "8.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable PHP/PHPUnit annotations
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Get Composer cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress

      - name: Create test-results directory
        run: mkdir -p build/test-results

      - name: Run PHPUnit
        run: |
          vendor/bin/phpunit \
            --testdox \
            --colors=always \
            --log-junit build/test-results/phpunit-${{ matrix.php }}.xml

      - name: Add PHPUnit summary
        if: always()
        env:
          PHP_VERSION_LABEL: ${{ matrix.php }}
        run: |
          FILE="build/test-results/phpunit-${PHP_VERSION_LABEL}.xml"

          {
            echo "## PHPUnit — PHP ${PHP_VERSION_LABEL}"
            echo

            if [[ -f "$FILE" ]]; then
              # Single quotes are deliberate: this is PHP, not shell expansion.
              # shellcheck disable=SC2016
              php -r '
                $xml = simplexml_load_file($argv[1]);
                $suite = $xml->testsuite ?? $xml;

                printf(
                    "| Tests | Failures | Errors | Skipped | Time |\n" .
                    "|---:|---:|---:|---:|---:|\n" .
                    "| %s | %s | %s | %s | %ss |\n",
                    $suite["tests"] ?? "?",
                    $suite["failures"] ?? "?",
                    $suite["errors"] ?? "?",
                    $suite["skipped"] ?? "?",
                    $suite["time"] ?? "?"
                );
              ' "$FILE" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "No PHPUnit result file was generated." >> "$GITHUB_STEP_SUMMARY"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PHPUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-results-php-${{ matrix.php }}-${{ github.run_id }}
          path: build/test-results/
          if-no-files-found: warn
          retention-days: 14

  phpunit-summary:
    name: PHPUnit Summary
    runs-on: ubuntu-latest
    needs: [phpunit]
    if: always()

    steps:
      - name: Download PHPUnit results
        uses: actions/download-artifact@v7
        with:
          pattern: phpunit-results-php-*
          path: build/test-results
          merge-multiple: true

      - name: PHPUnit combined summary
        if: always()
        shell: bash
        run: |
          {
            echo "## PHPUnit Results"
            echo
            echo "| PHP | Tests | Passed | Failures | Errors | Skipped | Time |"
            echo "|---:|---:|---:|---:|---:|---:|---:|"

            # Keep this list in step with strategy.matrix.php in the phpunit job.
            for version in 8.2 8.3 8.4; do
              file="build/test-results/phpunit-${version}.xml"

              if [[ ! -f "$file" ]]; then
                echo "| ${version} | — | — | — | — | — | — |"
                continue
              fi

              # Single quotes are deliberate: this is PHP, not shell expansion.
              # shellcheck disable=SC2016
              php -r '
                $version = $argv[1];
                $file    = $argv[2];

                $xml = simplexml_load_file($file);

                $tests    = 0;
                $failures = 0;
                $errors   = 0;
                $skipped  = 0;
                $time     = 0.0;

                $suites = isset($xml->testsuite)
                    ? $xml->testsuite
                    : [$xml];

                foreach ($suites as $suite) {
                    $tests    += (int) $suite["tests"];
                    $failures += (int) $suite["failures"];
                    $errors   += (int) $suite["errors"];
                    $skipped  += (int) $suite["skipped"];
                    $time     += (float) $suite["time"];
                }

                $passed = $tests - $failures - $errors - $skipped;

                printf(
                    "| %s | %d | %d | %d | %d | %d | %.2fs |\n",
                    $version,
                    $tests,
                    $passed,
                    $failures,
                    $errors,
                    $skipped,
                    $time
                );
              ' "$version" "$file"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify every artifact is listed
        if: always()
        shell: bash
        run: |
          expected="8.2 8.3 8.4"
          status=0
          shopt -s nullglob

          for f in build/test-results/phpunit-*.xml; do
            v=$(basename "$f" .xml)
            v=${v#phpunit-}
            case " $expected " in
              *" $v "*) ;;
              *) echo "::error::Found results for PHP $v, which is not in the summary version list — update it alongside strategy.matrix.php"; status=1 ;;
            esac
          done

          exit $status
