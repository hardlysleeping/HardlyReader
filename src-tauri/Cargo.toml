[package]
name = "hardlyreader"
version = "0.6.22"
# PolyForm Noncommercial has no SPDX id, so the crate points at the file.
license-file = "../LICENSE"
description = "HardlyReader - a FreshRSS reader"
authors = ["hardlysleeping"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hardlyreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2.8.3"
# The OPML export's save picker. The write itself is `files::save_text`, so this
# plugin only ever answers "which path did the reader choose".
tauri-plugin-dialog = "2"
# The local library: SQLite, opened by the webview through this plugin. Only the
# sqlite driver is compiled in — the postgres and mysql features would add a
# second network client to the binary for a database this app never talks to.
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# The phone-on-the-network server: tiny, blocking, one dependency, and it serves
# the assets that are already inside the binary.
tiny_http = "0.12"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
