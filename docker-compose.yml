# The browser build, in a container. Open http://localhost:8080 and enter your
# FreshRSS address on the connect screen — there is nothing to configure here.
services:
  hardlyreader:
    image: ghcr.io/hardlysleeping/hardlyreader:latest
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
