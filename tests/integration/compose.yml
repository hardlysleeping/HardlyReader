services:
  freshrss:
    image: freshrss/freshrss:1.30.1
    container_name: hardlyread-dev-freshrss
    ports: ["127.0.0.1:18080:80"]
    environment:
      TZ: UTC
      FRESHRSS_INSTALL: |-
        --api-enabled
        --base-url http://localhost:18080
        --db-type sqlite
        --default-user itest
        --environment development
        --language en
      FRESHRSS_USER: |-
        --user itest
        --password itest-password
        --api-password itest-api-password
        --no-default-feeds
        --language en
    volumes:
      - hardlyread-dev-data:/var/www/FreshRSS/data
    healthcheck:
      test: ["CMD", "cli/health.php"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  hardlyread-dev-data:
